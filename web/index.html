<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIF Studio</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <main class="page">
    <section class="section">
      <h2>Base GIF</h2>
      <label class="dropzone" id="base-dropzone" for="base-file-input">
        <input id="base-file-input" type="file" accept=".gif,image/gif" hidden />
        <span>Drop GIF here or click to browse</span>
      </label>
      <div class="advanced base-url-section">
        <div class="advanced-title">Base GIF URL</div>
        <div class="controls base-url-controls">
          <label>
            <span>URL</span>
            <input id="base-url-input" type="url" placeholder="https://example.com/base.gif" />
          </label>
          <div class="base-url-action">
            <button class="action-button" id="base-url-load-button" type="button">Load GIF URL</button>
          </div>
        </div>
      </div>
      <div class="selected-file" id="base-selected-file">Using default base GIF.</div>
      <div class="preview-frame">
        <img id="base-preview-image" src="/base.gif" alt="Base woman is talking GIF" />
      </div>
    </section>

    <section class="section">
      <h2>Drop overlay</h2>
      <label class="dropzone" id="dropzone" for="file-input">
        <input id="file-input" type="file" accept=".webp,.png,.jpg,.jpeg,image/webp,image/png,image/jpeg" hidden />
        <span>Drop image here or click to browse</span>
      </label>
      <div class="advanced overlay-url-section">
        <div class="advanced-title">Image URL</div>
        <div class="controls overlay-url-controls">
          <label>
            <span>URL</span>
            <input id="overlay-url-input" type="url" placeholder="https://example.com/overlay.png" />
          </label>
          <div class="overlay-url-action">
            <button class="action-button" id="overlay-url-load-button" type="button">Load image URL</button>
          </div>
        </div>
      </div>
      <div class="selected-file" id="selected-file">Using default overlay image.</div>
      <div class="preview-frame overlay-preview" id="overlay-preview" hidden>
        <img id="overlay-preview-image" alt="Selected overlay preview" />
      </div>
    </section>

    <section class="section">
      <h2>Editor</h2>
      <div class="preview-frame overlay-editor" id="overlay-editor">
        <div class="placement-stage" id="placement-stage">
          <img class="stage-base" id="stage-base" src="/base.gif" alt="Base animation placement preview" />
          <div class="stage-overlay" id="stage-overlay" hidden>
            <img id="overlay-image" alt="Selected overlay preview" />
          </div>
        </div>
      </div>
      <div class="advanced">
        <div class="advanced-title">Placement</div>
        <div class="controls">
          <label>
            <span>X</span>
            <input id="x-input" type="number" step="1" value="58" />
          </label>
          <label>
            <span>Y</span>
            <input id="y-input" type="number" step="1" value="0" />
          </label>
          <label>
            <span>Width</span>
            <input id="width-input" type="number" min="1" step="1" value="120" />
          </label>
          <label>
            <span>Height</span>
            <input id="height-input" type="number" min="1" step="1" value="120" />
          </label>
        </div>
      </div>
      <button class="action-button" id="render-button" disabled>Render GIF</button>
      <div class="status" id="status">Waiting for an overlay image.</div>
    </section>

    <section class="section">
      <h2>Result</h2>
      <div class="preview-frame result-frame empty" id="result-frame">
        <img id="result-image" alt="Rendered GIF preview" hidden />
        <div class="result-placeholder" id="result-placeholder">No result yet.</div>
      </div>
      <a class="action-button download-button disabled" id="download-link" aria-disabled="true">Download GIF</a>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>

</html>
